events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. HTTP(80 포트) 접속 시 HTTPS(20443 포트)로 자동 리다이렉트
    server {
        listen 80;
        server_name aimeow.duckdns.org localhost;

        return 301 https://$host:20443$request_uri;
    }

    # 2. HTTPS 통합 서버
    server {
        listen 443 ssl; # 👈 외부/도커에서 443 포트로 진입하는 구조이면 443으로 지정
        server_name aimeow.duckdns.org localhost;

        # 🎯 SSL 인증서 경로
        ssl_certificate     /etc/nginx/certs/live/aimeow.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/aimeow.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 🔹 FastAPI 지식 관리 뷰 (/view)
        location /view {
            proxy_pass http://host.docker.internal:8000;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # 🔹 MCP 및 SSE 관련 요청 통합 처리 (/mcp, /sse, /messages 등)
        location ~ ^/(mcp|sse|messages) {
            proxy_pass http://host.docker.internal:8001;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP 1.1 및 WebSocket / SSE 커넥션 유연 처리 (수정 완료)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade"; # 👈 SSE 및 스트리밍을 안정적으로 연결 유지

            # SSE (Server-Sent Events) 필수 스트리밍 설정
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            
            # SSE 전용 타임아웃
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 🔹 Open WebUI (/ 루트)
        location / {
            proxy_pass http://open-webui:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}